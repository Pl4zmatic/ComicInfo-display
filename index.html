<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Comic Info Display</title>
        <script type="module" src="scripts/events/chooseFiles.js"></script>
        <script type="module" src="scripts/XmlEditor.js"></script>
        <script type="module" src="scripts/XmlForm.js"></script>
        <link rel="icon" type="image/x-icon" href="assets/xml-document-svgrepo-com.png" />
        <link rel="stylesheet" href="styles/css/main.css" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;1,100;1,200;1,300;1,400;1,500;1,600;1,700&display=swap"
            rel="stylesheet" />
    </head>
    <body>
        <header>
            <span class="iconWithTextContainer">
                <img src="assets/xml-document-svgrepo-com.png" alt="" class="icon" />
                Comic Info Display
            </span>
            <span id="spanFolderName"></span>
            <span>
                <button id="otherFolderButton" class="iconWithTextContainer button">
                    <img src="assets/folder-edit-svgrepo-com.png" alt="" class="icon" />
                    Load Folder
                </button>
                <button id="otherZipButton" class="iconWithTextContainer button">
                    <img src="assets/zip-svgrepo-com.png" alt="" class="icon" />
                    Load Zip
                </button>
            </span>
        </header>

        <main>
            <dialog id="dialogExport" closedby="any" class="border">
                <div class="dialogContent">
                    <strong>Download Files</strong>
                    <small>Choose a format and download option.</small>
                    <hr />
                    <label for="selectExtension">File Format</label>
                    <select name="extension" id="selectExtension">
                        <option value=".cbz" selected>.cbz</option>
                        <option value=".zip">.zip</option>
                    </select>

                    <div class="buttonRow">
                        <button id="buttonBatch" class="button" title="Download everything with populated ComicInfo files.">Batch Download</button>
                        <button id="buttonSingle" class="button" title="Download currently selected item with ComicInfo added.">Single File</button>
                    </div>
                </div>

                <div id="loadingContainer" class="hidden">
                    <div>
                        <span id="loadingTitle"></span>
                        <span id="loadingCounter"></span>
                    </div>
                </div>
            </dialog>

            <div id="contentEmpty">
                <div class="flex-vertical flex-end">
                    <span>
                        <label for="inputFileFolder">Choose folder(s)</label>
                        <input type="file" name="inputFileFolder" id="inputFileFolder" webkitdirectory multiple />
                    </span>

                    <span>
                        <label for="inputFileZip">Choose zip file(s)</label>
                        <input type="file" name="inputFileZip" id="inputFileZip" accept=".zip,.cbz" multiple />
                    </span>
                </div>
            </div>

            <div id="contentSelected" class="hidden">
                <div id="previewContainer">
                    <div id="previewList"></div>
                    <div id="preview">
                        <small>Select an item above to display data.</small>
                    </div>
                </div>
                <div id="xmlForm">
                    <div class="formLabel" id="pinAllContainer">
                        <button id="pinAll" class="button border">
                            Pin All
                            <img src="assets/pin-svgrepo-com.png" alt="" />
                        </button>
                    </div>

                    <label for="xmlTitle" class="formLabel">
                        Title
                        <button class="button border">
                            <img src="assets/pin-svgrepo-com.png" alt="" />
                        </button>
                    </label>
                    <input type="text" name="title" id="xmlTitle" />

                    <label for="xmlSeries" class="formLabel">
                        Series
                        <button type="button" class="button border">
                            <img src="assets/pin-svgrepo-com.png" alt="" />
                        </button>
                    </label>
                    <input type="text" name="series" id="xmlSeries" />

                    <label for="xmlNumber" class="formLabel">
                        Number
                        <button type="button" class="button border">
                            <img src="assets/pin-svgrepo-com.png" alt="" />
                        </button>
                    </label>
                    <input type="number" name="number" id="xmlNumber" />

                    <label for="xmlVolume" class="formLabel">
                        Volume
                        <button type="button" class="button border">
                            <img src="assets/pin-svgrepo-com.png" alt="" />
                        </button>
                    </label>
                    <input type="number" name="volume" id="xmlVolume" />

                    <label for="xmlCount" class="formLabel">
                        Count
                        <button type="button" class="button border">
                            <img src="assets/pin-svgrepo-com.png" alt="" />
                        </button>
                    </label>
                    <input type="number" name="count" id="xmlCount" />

                    <label for="xmlSummary" class="formLabel">
                        Summary
                        <button type="button" class="button border">
                            <img src="assets/pin-svgrepo-com.png" alt="" />
                        </button>
                    </label>
                    <div class="textareaField border">
                        <textarea name="summary" id="xmlSummary" rows="3"></textarea>
                    </div>

                    <label for="xmlWriter" class="formLabel">
                        Writer
                        <button type="button" class="button border">
                            <img src="assets/pin-svgrepo-com.png" alt="" />
                        </button>
                    </label>
                    <input type="text" name="writer" id="xmlWriter" />

                    <label for="xmlPublisher" class="formLabel">
                        Publisher
                        <button type="button" class="button border">
                            <img src="assets/pin-svgrepo-com.png" alt="" />
                        </button>
                    </label>
                    <input type="text" name="publisher" id="xmlPublisher" />

                    <label for="xmlDate" class="formLabel">
                        Date
                        <button type="button" class="button border">
                            <img src="assets/pin-svgrepo-com.png" alt="" />
                        </button>
                    </label>
                    <input type="date" name="date" id="xmlDate" />

                    <div id="genreAndTagsContainer">
                        <span id="genreContainer">
                            <label for="xmlGenre" class="formLabel">
                                Genre
                                <button type="button" class="button border">
                                    <img src="assets/pin-svgrepo-com.png" alt="" />
                                </button>
                            </label>
                            <div class="textareaField border">
                                <textarea
                                    name="genre"
                                    id="xmlGenre"
                                    class="categoricalValuesTextarea"
                                    rows="3"
                                    placeholder="Comma seperated values e.g:&#10;action,sci-fi,romance&#10;Newline seperated also accepted."></textarea>
                            </div>
                        </span>

                        <span id="tagsContainer">
                            <label for="xmlTags" class="formLabel">
                                Tags
                                <button type="button" class="button border">
                                    <img src="assets/pin-svgrepo-com.png" alt="" />
                                </button>
                            </label>
                            <div class="textareaField border">
                                <textarea
                                    name="tags"
                                    id="xmlTags"
                                    class="categoricalValuesTextarea"
                                    rows="3"
                                    placeholder="Comma seperated values e.g:&#10;action,sci-fi,romance&#10;Newline seperated also accepted."></textarea>
                            </div>
                        </span>

                        <div class="flex-horizontal" id="formatContainer">
                            <span>
                                <input type="checkbox" name="checkboxPascal" id="checkboxPascal" />
                                <label for="checkboxPascal">Pascal Case</label>
                            </span>
                            <button id="buttonFormat" class="button border">Format</button>
                        </div>
                    </div>

                    <label for="xmlLanguage" class="formLabel">
                        Language
                        <button type="button" class="button border">
                            <img src="assets/pin-svgrepo-com.png" alt="" />
                        </button>
                    </label>
                    <select name="language" id="xmlLanguage">
                        <option value="en">English</option>
                        <option value="ja">Japanese</option>
                    </select>

                    <label for="xmlManga" class="formLabel">
                        Manga
                        <button type="button" class="button border">
                            <img src="assets/pin-svgrepo-com.png" alt="" />
                        </button>
                    </label>
                    <select name="manga" id="xmlManga">
                        <option value="No">No</option>
                        <option value="Yes">Yes</option>
                        <option value="YesAndRightToLeft">Right to Left</option>
                    </select>
                </div>
                <div id="editorContainer">
                    <h3>ComicInfo.xml</h3>
                    <div id="xmlOutput"></div>
                    <button id="buttonExport" class="button" command="show-modal" commandfor="dialogExport">Export</button>
                </div>
            </div>
        </main>
    </body>
</html>
